<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS U-15G | 試合分析ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --team-main: #0A2444;      /* ネイビー */
            --team-sub: #0077B6;       /* ブルー */
            --team-accent: #F59E0B;    /* イエローオレンジ */
            --bg-color: #f1f5f9;       /* 背景色 */
        }
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; background-color: var(--bg-color); color: #334155; }
        .stat-value { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
        
        /* プログレスバーのアニメーション */
        .bar-bg { background-color: #e2e8f0; border-radius: 999px; overflow: hidden; height: 10px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.1); }
        .bar-fill { height: 100%; border-radius: 999px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* グラデーションテキスト */
        .text-gradient-blue { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, var(--team-main), var(--team-sub)); }
        .text-gradient-amber { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, #d97706, #fbbf24); }
        .text-gradient-rose { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, #be123c, #fb7185); }
        .text-gradient-slate { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, #475569, #94a3b8); }

        /* セレクトボックスの矢印カスタマイズ */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: "\f078"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.6); pointer-events: none; font-size: 12px;
        }

        /* 🖨️ 印刷用スタイル */
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background-color: #ffffff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            header { background: #0A2444 !important; padding: 12px 20px !important; }
            .btn-sync, .select-wrapper::after { display: none !important; }
            select#match-selector { appearance: none !important; -webkit-appearance: none !important; border: none !important; background: transparent !important; color: white !important; font-size: 1.25rem !important; padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-[#0A2444] to-[#004e7a] text-white shadow-md z-50 h-[4rem] sm:h-[5rem] flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-full flex justify-between items-center">
            
            <div class="flex items-center gap-4 sm:gap-6 w-full sm:w-auto">
                <!-- ロゴ・タイトル -->
                <h1 class="text-xl sm:text-2xl font-black tracking-widest leading-none drop-shadow-sm flex items-center flex-shrink-0">
                    <i class="fas fa-chart-line mr-2 text-[#0077B6]"></i> ITS U-15G
                </h1>
                
                <!-- PC/タブレット用 試合セレクター -->
                <div class="hidden sm:block select-wrapper bg-white/10 rounded-lg border border-white/20 px-3 py-1.5 focus-within:ring-2 focus-within:ring-[#0077B6] transition-all min-w-[280px] lg:min-w-[350px]">
                    <div class="text-[10px] text-[#0077B6] font-bold tracking-wider mb-0.5">分析する試合を選択</div>
                    <select id="match-selector" onchange="renderDashboard()" class="w-full bg-transparent text-white font-bold outline-none cursor-pointer text-sm sm:text-base appearance-none pr-6">
                        <option value="" class="text-slate-800">データを読み込み中...</option>
                    </select>
                </div>
            </div>

            <!-- 更新ボタン -->
            <button onclick="fetchData()" class="btn-sync px-3 sm:px-4 py-2 bg-white/10 hover:bg-white/20 text-xs sm:text-sm font-bold rounded-lg flex items-center transition-all border border-white/10 backdrop-blur-sm flex-shrink-0">
                <i class="fas fa-sync-alt mr-1.5" id="sync-icon"></i> <span class="hidden sm:inline">データ更新</span>
            </button>
        </div>
    </header>

    <!-- スマホ用 試合セレクター -->
    <div class="sm:hidden px-4 py-3 bg-white border-b border-slate-200 shadow-sm z-40 relative">
        <div class="text-[10px] text-slate-500 font-bold mb-1">分析する試合を選択</div>
        <select id="match-selector-mobile" onchange="syncSelectors(this)" class="w-full bg-slate-50 border border-slate-300 text-[#0A2444] text-sm font-bold rounded-lg p-2.5 outline-none">
            <option value="">データを読み込み中...</option>
        </select>
    </div>

    <!-- メインダッシュボード -->
    <main class="flex-grow w-full max-w-6xl mx-auto p-4 sm:p-5 relative flex flex-col">
        
        <!-- ローディングオーバーレイ -->
        <div id="loading-overlay" class="absolute inset-0 bg-[#f1f5f9]/90 backdrop-blur-sm z-40 flex flex-col items-center justify-center rounded-2xl">
            <i class="fas fa-circle-notch fa-spin text-5xl text-[#0077B6] mb-4"></i>
            <p class="font-bold text-slate-600 tracking-wider animate-pulse">データを読み込み中...</p>
        </div>

        <div id="dashboard-content" class="hidden flex flex-col gap-4 sm:gap-6 animate-[fadeIn_0.5s_ease-out] pb-10">
            
            <!-- 🆕 上段：3項目メインサマリー（プログレスバー付き） -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-5">
                <!-- 1. チーム シュート成功率 -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col justify-between relative overflow-hidden">
                    <div class="flex justify-between items-end mb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-[#0077B6]"><i class="fas fa-bullseye text-base sm:text-lg"></i></div>
                            <div class="text-xs sm:text-sm font-black text-slate-700">自チーム 決定率</div>
                        </div>
                        <div class="text-[10px] sm:text-xs font-bold text-slate-400">ゴール <span class="text-slate-600 text-sm sm:text-base" id="dash-shot-detail">0 / 0</span></div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-3xl sm:text-5xl font-black text-[#0077B6] stat-value leading-none"><span id="dash-shot-rate">0.0</span><span class="text-base sm:text-xl text-slate-400 ml-0.5">%</span></div>
                        <div class="flex-grow bar-bg"><div class="bar-fill bg-gradient-to-r from-[#0A2444] to-[#0077B6]" id="bar-shot-rate" style="width: 0%;"></div></div>
                    </div>
                </div>

                <!-- 2. GK セーブ率 -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col justify-between relative overflow-hidden">
                    <div class="flex justify-between items-end mb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-[#0A2444]"><i class="fas fa-hands text-base sm:text-lg"></i></div>
                            <div class="text-xs sm:text-sm font-black text-slate-700">GK セーブ率</div>
                        </div>
                        <div class="text-[10px] sm:text-xs font-bold text-slate-400">セーブ <span class="text-slate-600 text-sm sm:text-base" id="dash-save-detail">0 / 0</span></div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-3xl sm:text-5xl font-black text-[#0A2444] stat-value leading-none"><span id="dash-save-rate">0.0</span><span class="text-base sm:text-xl text-slate-400 ml-0.5">%</span></div>
                        <div class="flex-grow bar-bg"><div class="bar-fill bg-gradient-to-r from-slate-500 to-[#0A2444]" id="bar-save-rate" style="width: 0%;"></div></div>
                    </div>
                </div>

                <!-- 3. 相手チーム シュート成功率 -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col justify-between relative overflow-hidden">
                    <div class="flex justify-between items-end mb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-lg bg-rose-50 flex items-center justify-center text-rose-500"><i class="fas fa-crosshairs text-base sm:text-lg"></i></div>
                            <div class="text-xs sm:text-sm font-black text-slate-700">相手 決定率</div>
                        </div>
                        <div class="text-[10px] sm:text-xs font-bold text-slate-400">被ゴール <span class="text-slate-600 text-sm sm:text-base" id="dash-opponent-shot-detail">0 / 0</span></div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-3xl sm:text-5xl font-black text-rose-500 stat-value leading-none"><span id="dash-opponent-shot-rate">0.0</span><span class="text-base sm:text-xl text-slate-400 ml-0.5">%</span></div>
                        <div class="flex-grow bar-bg"><div class="bar-fill bg-gradient-to-r from-rose-300 to-rose-500" id="bar-opponent-shot-rate" style="width: 0%;"></div></div>
                    </div>
                </div>
            </div>

            <!-- 🆕 中段：4項目パネル -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                <!-- 得点 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col justify-center items-center">
                    <div class="text-xs sm:text-sm font-bold text-slate-400 mb-1">自チーム得点</div>
                    <div class="text-4xl sm:text-5xl font-black text-gradient-blue stat-value leading-none" id="dash-goals">0</div>
                </div>
                <!-- 失点 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col justify-center items-center">
                    <div class="text-xs sm:text-sm font-bold text-slate-400 mb-1">相手得点 (失点)</div>
                    <div class="text-4xl sm:text-5xl font-black text-gradient-rose stat-value leading-none" id="dash-allowed">0</div>
                </div>
                <!-- 自ミス -->
                <div class="bg-gradient-to-br from-amber-50 to-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col justify-center items-center">
                    <div class="text-xs sm:text-sm font-bold text-amber-600 mb-1">自チーム ミス</div>
                    <div class="text-4xl sm:text-5xl font-black text-gradient-amber stat-value leading-none" id="dash-errors">0</div>
                </div>
                <!-- 相手ミス -->
                <div class="bg-gradient-to-br from-slate-50 to-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col justify-center items-center">
                    <div class="text-xs sm:text-sm font-bold text-slate-500 mb-1">相手チーム ミス</div>
                    <div class="text-4xl sm:text-5xl font-black text-gradient-slate stat-value leading-none" id="dash-opponent-errors">0</div>
                </div>
            </div>

            <!-- 下段：シュート種類別 -->
            <div class="flex flex-col gap-4 sm:gap-5 mt-2">
                <!-- 自チームシュート -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 relative overflow-hidden">
                    <h3 class="text-sm sm:text-base font-black text-slate-700 mb-3 flex items-center"><i class="fas fa-bullseye text-[#0077B6] mr-2"></i>自チーム シュート種類別の決定率</h3>
                    <div class="grid grid-cols-4 sm:grid-cols-7 gap-2 sm:gap-3" id="shot-types-container"></div>
                </div>

                <!-- 相手シュート(失点) -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 relative overflow-hidden">
                    <h3 class="text-sm sm:text-base font-black text-slate-700 mb-3 flex items-center"><i class="fas fa-shield-alt text-rose-500 mr-2"></i>相手チーム シュート種類別の決定率 (自チームの失点率)</h3>
                    <div class="grid grid-cols-4 sm:grid-cols-7 gap-2 sm:gap-3" id="gk-shot-types-container"></div>
                </div>
            </div>

            <!-- 選手別スタッツ -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 relative overflow-hidden mt-2">
                <h3 class="text-sm sm:text-base font-black text-slate-700 mb-3 flex items-center"><i class="fas fa-users text-[#0A2444] mr-2"></i>選手別スタッツ</h3>
                <div class="overflow-x-auto pb-2">
                    <table class="w-full text-left border-collapse whitespace-nowrap min-w-[800px]">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-xs sm:text-sm font-bold border-b border-slate-200 uppercase tracking-wider">
                                <th class="p-3 sm:p-4 rounded-tl-lg">選手名</th>
                                <th class="p-3 sm:p-4 text-center">POS</th>
                                <th class="p-3 sm:p-4 text-right">シュート / 決定率</th>
                                <th class="p-3 sm:p-4 text-center">シュート内訳 (L/M/C/P/F/S/7m)</th>
                                <th class="p-3 sm:p-4 text-center">ミス</th>
                                <th class="p-3 sm:p-4 text-right rounded-tr-lg">セーブ / セーブ率</th>
                            </tr>
                        </thead>
                        <tbody id="player-stats-container" class="text-sm divide-y divide-slate-100">
                            <!-- JSで生成 -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // 🚨 GASのURL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzVq24DpMl9rmH2wj9a31WZKdHt5kLx0IPhcLszblpNqcZmgf3UEhWQjEqc9I5ikz9wmg/exec";
        let rawData = [];
        let matches = [];

        const typeLabels = { L: 'ﾃﾞｨｽﾀﾝｽ', M: 'ﾐﾄﾞﾙ', C: 'ｶｯﾄｲﾝ', P: 'ﾎﾟｽﾄ', F: 'ﾉｰﾏｰｸ', S: 'ｻｲﾄﾞ', '7m': '7mｽﾛｰ' };
        const shotTypesArray = ['L', 'M', 'C', 'P', 'F', 'S', '7m'];

        function formatDateString(rawDate) {
            if (!rawDate) return "日付不明";
            if (rawDate.includes('T')) {
                const d = new Date(rawDate);
                return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
            }
            return rawDate;
        }

        async function fetchData() {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.classList.add('fa-spin');
            document.getElementById('loading-overlay').classList.remove('hidden');
            document.getElementById('dashboard-content').classList.add('hidden');
            
            try {
                const response = await fetch(GAS_URL);
                rawData = await response.json();
                processMatches();
            } catch (error) {
                alert("データの取得に失敗しました。電波状況を確認してください。");
                console.error(error);
            } finally {
                if(icon) icon.classList.remove('fa-spin');
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        }

        function processMatches() {
            const matchGroups = {};
            rawData.forEach(row => {
                if(!row.opponent) return; 
                const cleanDate = formatDateString(row.matchDate);
                const key = `${cleanDate} vs ${row.opponent}`;
                if (!matchGroups[key]) matchGroups[key] = [];
                matchGroups[key].push(row);
            });

            matches = Object.keys(matchGroups).map(key => ({
                label: key,
                data: matchGroups[key]
            })).reverse(); 

            const optionsHTML = matches.length === 0 
                ? '<option value="">データがありません</option>'
                : matches.map((m, i) => `<option value="${i}">${m.label}</option>`).join('');

            document.getElementById('match-selector').innerHTML = optionsHTML;
            document.getElementById('match-selector-mobile').innerHTML = optionsHTML;

            if (matches.length > 0) {
                document.getElementById('dashboard-content').classList.remove('hidden');
                setTimeout(renderDashboard, 50);
            }
        }

        function syncSelectors(element) {
            const val = element.value;
            document.getElementById('match-selector').value = val;
            document.getElementById('match-selector-mobile').value = val;
            renderDashboard();
        }

        function renderDashboard() {
            const index = document.getElementById('match-selector').value;
            if (index === "") return;
            const matchData = matches[index].data;

            let stats = {
                goals: 0, miss: 0, errors: 0, saves: 0, allowed: 0, opponent_errors: 0,
                types: { L: {g:0, m:0}, M: {g:0, m:0}, C: {g:0, m:0}, P: {g:0, m:0}, F: {g:0, m:0}, S: {g:0, m:0}, '7m': {g:0, m:0} },
                gkTypes: { L: {s:0, a:0}, M: {s:0, a:0}, C: {s:0, a:0}, P: {s:0, a:0}, F: {s:0, a:0}, S: {s:0, a:0}, '7m': {s:0, a:0} }
            };

            // データ集計
            matchData.forEach(p => {
                if (p.position === 'CP') {
                    shotTypesArray.forEach(t => {
                        const gKey = t === '7m' ? '7m_goals' : `${t}_goals`;
                        const mKey = t === '7m' ? '7m_miss' : `${t}_miss`;
                        const g = parseInt(p[gKey]) || 0;
                        const m = parseInt(p[mKey]) || 0;
                        stats.types[t].g += g;
                        stats.types[t].m += m;
                        stats.goals += g;
                        stats.miss += m;
                    });
                    stats.errors += (parseInt(p.errors) || 0);
                } else if (p.position === 'GK') {
                    let rowSaves = 0;
                    let rowAllowed = 0;
                    shotTypesArray.forEach(t => {
                        const sKey = t === '7m' ? 'saves_7m' : `${t}_saves`;
                        const aKey = t === '7m' ? 'allowed_7m' : `${t}_allowed`;
                        const s = parseInt(p[sKey]) || 0;
                        const a = parseInt(p[aKey]) || 0;
                        stats.gkTypes[t].s += s;
                        stats.gkTypes[t].a += a;
                        rowSaves += s;
                        rowAllowed += a;
                    });
                    
                    // 過去データ（種類別記録がない場合）への互換性対応
                    if (rowSaves === 0 && rowAllowed === 0) {
                        stats.saves += parseInt(p.saves) || 0;
                        stats.allowed += parseInt(p.allowed) || 0;
                    } else {
                        stats.saves += rowSaves;
                        stats.allowed += rowAllowed;
                    }
                    stats.errors += (parseInt(p.errors) || 0);
                }
                
                if (p.opponent_errors) {
                    stats.opponent_errors = Math.max(stats.opponent_errors, parseInt(p.opponent_errors) || 0);
                }
            });

            // サマリー数値の反映
            document.getElementById('dash-goals').innerText = stats.goals;
            document.getElementById('dash-allowed').innerText = stats.allowed;
            document.getElementById('dash-errors').innerText = stats.errors;
            document.getElementById('dash-opponent-errors').innerText = stats.opponent_errors;

            document.getElementById('bar-shot-rate').style.width = '0%';
            document.getElementById('bar-save-rate').style.width = '0%';
            document.getElementById('bar-opponent-shot-rate').style.width = '0%';

            setTimeout(() => {
                // 1. 自チームシュート成功率
                const totalShots = stats.goals + stats.miss; 
                const shotRate = totalShots > 0 ? (stats.goals / totalShots) * 100 : 0;
                document.getElementById('dash-shot-rate').innerText = shotRate.toFixed(1);
                document.getElementById('dash-shot-detail').innerText = `${stats.goals} / ${totalShots}`;
                document.getElementById('bar-shot-rate').style.width = `${shotRate}%`;

                // 2. GK セーブ率
                const totalFaced = stats.saves + stats.allowed; 
                const saveRate = totalFaced > 0 ? (stats.saves / totalFaced) * 100 : 0;
                document.getElementById('dash-save-rate').innerText = saveRate.toFixed(1);
                document.getElementById('dash-save-detail').innerText = `${stats.saves} / ${totalFaced}`;
                document.getElementById('bar-save-rate').style.width = `${saveRate}%`;

                // 3. 相手チーム シュート成功率 (失点率)
                const opponentShotRate = totalFaced > 0 ? (stats.allowed / totalFaced) * 100 : 0;
                document.getElementById('dash-opponent-shot-rate').innerText = opponentShotRate.toFixed(1);
                document.getElementById('dash-opponent-shot-detail').innerText = `${stats.allowed} / ${totalFaced}`;
                document.getElementById('bar-opponent-shot-rate').style.width = `${opponentShotRate}%`;
            }, 50);

            // 自チーム シュート内訳の生成
            document.getElementById('shot-types-container').innerHTML = shotTypesArray.map(t => {
                const g = stats.types[t].g; 
                const total = g + stats.types[t].m; 
                const rate = total > 0 ? (g / total) * 100 : 0;
                let colorClass = "text-slate-700"; let topBarColor = "bg-slate-200";
                
                if(total > 0) { 
                    if(rate >= 60) { colorClass = "text-[#0077B6]"; topBarColor = "bg-[#0077B6]"; } 
                    else if(rate < 30) { colorClass = "text-rose-500"; topBarColor = "bg-rose-500"; } 
                }
                
                return `<div class="bg-slate-50 rounded-xl p-2 sm:p-3 flex flex-col justify-center items-center border border-slate-100 relative overflow-hidden"><div class="absolute top-0 left-0 w-full h-1 ${topBarColor}"></div><div class="text-2xl sm:text-3xl font-black stat-value ${colorClass} mt-1 leading-none">${rate.toFixed(0)}<span class="text-[10px] sm:text-xs font-bold ml-0.5 text-slate-400">%</span></div><div class="font-black text-slate-700 mt-1 text-[10px] sm:text-xs whitespace-nowrap">${t} <span class="font-bold text-[8px] sm:text-[9px] text-slate-500 block text-center">${typeLabels[t]}</span></div><div class="mt-auto pt-1 sm:pt-2 w-full text-center border-t border-slate-200 border-dashed"><span class="text-[10px] sm:text-xs font-bold text-slate-600">${g} <span class="text-slate-300 font-normal mx-0.5">/</span> ${total}</span></div></div>`;
            }).join('');

            // 相手チーム シュート内訳(失点)の生成
            document.getElementById('gk-shot-types-container').innerHTML = shotTypesArray.map(t => {
                const a = stats.gkTypes[t].a; 
                const total = stats.gkTypes[t].s + a; 
                const rate = total > 0 ? (a / total) * 100 : 0;
                let colorClass = "text-slate-700"; let topBarColor = "bg-slate-200";
                
                if(total > 0) { 
                    if(rate >= 60) { colorClass = "text-rose-500"; topBarColor = "bg-rose-500"; } 
                    else if(rate < 30) { colorClass = "text-[#0077B6]"; topBarColor = "bg-[#0077B6]"; } 
                }
                
                return `<div class="bg-slate-50 rounded-xl p-2 sm:p-3 flex flex-col justify-center items-center border border-slate-100 relative overflow-hidden"><div class="absolute top-0 left-0 w-full h-1 ${topBarColor}"></div><div class="text-2xl sm:text-3xl font-black stat-value ${colorClass} mt-1 leading-none">${rate.toFixed(0)}<span class="text-[10px] sm:text-xs font-bold ml-0.5 text-slate-400">%</span></div><div class="font-black text-slate-700 mt-1 text-[10px] sm:text-xs whitespace-nowrap">${t} <span class="font-bold text-[8px] sm:text-[9px] text-slate-500 block text-center">${typeLabels[t]}</span></div><div class="mt-auto pt-1 sm:pt-2 w-full text-center border-t border-slate-200 border-dashed"><span class="text-[10px] sm:text-xs font-bold text-slate-600"><span class="text-rose-500">${a}</span> <span class="text-slate-300 font-normal mx-0.5">/</span> ${total}</span></div></div>`;
            }).join('');

            // 選手別スタッツ表の生成
            const formatType = (t, g, m) => `<span class="mx-0.5 sm:mx-1"><span class="text-slate-400 font-normal">${t}:</span><span class="text-slate-700 font-bold">${g}/${g+m}</span></span>`;

            const playerRows = matchData.map(p => {
                if (p.position === 'CP') {
                    let goals=0, misses=0; let detail = '';
                    shotTypesArray.forEach(t => { 
                        const gKey = t === '7m' ? '7m_goals' : `${t}_goals`;
                        const mKey = t === '7m' ? '7m_miss' : `${t}_miss`;
                        const g = parseInt(p[gKey]) || 0;
                        const m = parseInt(p[mKey]) || 0;
                        goals += g; misses += m; 
                        detail += formatType(t, g, m); 
                    });
                    
                    const shots = goals + misses;
                    const rate = shots > 0 ? ((goals / shots) * 100).toFixed(1) : "0.0";
                    
                    return `
                        <tr class="hover:bg-blue-50/50 transition-colors group">
                            <td class="p-3 sm:p-4 font-bold text-slate-700 group-hover:text-[#0077B6]">${p.name}</td>
                            <td class="p-3 sm:p-4 text-center"><span class="bg-blue-100 text-[#0077B6] px-2 py-0.5 rounded text-[10px] font-black tracking-wider">CP</span></td>
                            <td class="p-3 sm:p-4 text-right stat-value"><span class="font-bold text-slate-600">${goals}/${shots}</span> <span class="text-[#0077B6] font-black ml-2 w-10 sm:w-12 inline-block text-right">${rate}%</span></td>
                            <td class="p-3 sm:p-4 text-center text-xs tracking-tighter">${detail}</td>
                            <td class="p-3 sm:p-4 text-center stat-value font-black text-amber-500">${p.errors > 0 ? p.errors : '<span class="text-slate-300 font-normal">-</span>'}</td>
                            <td class="p-3 sm:p-4 text-right text-slate-300 font-normal">-</td>
                        </tr>
                    `;
                } else if (p.position === 'GK') {
                    let saves=0, allowed=0; let detail = '';
                    let hasDetail = false;
                    
                    shotTypesArray.forEach(t => { 
                        const sKey = t === '7m' ? 'saves_7m' : `${t}_saves`;
                        const aKey = t === '7m' ? 'allowed_7m' : `${t}_allowed`;
                        const s = parseInt(p[sKey]) || 0;
                        const a = parseInt(p[aKey]) || 0;
                        if(s > 0 || a > 0) hasDetail = true;
                        saves += s; allowed += a; 
                        detail += formatType(t, s, a); 
                    });

                    // 過去データのフォールバック
                    if (!hasDetail) {
                        saves = parseInt(p.saves) || 0;
                        allowed = parseInt(p.allowed) || 0;
                        detail = '<span class="text-slate-400">詳細データなし</span>';
                    }

                    const faced = saves + allowed;
                    const rate = faced > 0 ? ((saves / faced) * 100).toFixed(1) : "0.0";
                    
                    return `
                        <tr class="hover:bg-slate-100 transition-colors group">
                            <td class="p-3 sm:p-4 font-bold text-slate-700 group-hover:text-[#0A2444]">${p.name}</td>
                            <td class="p-3 sm:p-4 text-center"><span class="bg-slate-200 text-[#0A2444] px-2 py-0.5 rounded text-[10px] font-black tracking-wider">GK</span></td>
                            <td class="p-3 sm:p-4 text-right text-slate-300 font-normal">-</td>
                            <td class="p-3 sm:p-4 text-center text-xs tracking-tighter">${detail}</td>
                            <td class="p-3 sm:p-4 text-center stat-value font-black text-amber-500">${p.errors > 0 ? p.errors : '<span class="text-slate-300 font-normal">-</span>'}</td>
                            <td class="p-3 sm:p-4 text-right stat-value"><span class="font-bold text-slate-600">${saves}/${faced}</span> <span class="text-[#0A2444] font-black ml-2 w-10 sm:w-12 inline-block text-right">${rate}%</span></td>
                        </tr>
                    `;
                }
            }).join('');
            
            document.getElementById('player-stats-container').innerHTML = playerRows;
        }

        window.onload = fetchData;
    </script>
</body>
</html>
