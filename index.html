<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITS U-15G | 試合分析ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --team-main: #0A2444;      /* ネイビー */
            --team-sub: #0077B6;       /* ブルー */
            --team-accent: #F59E0B;    /* イエローオレンジ */
            --bg-color: #f1f5f9;       /* 背景色 */
        }
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; background-color: var(--bg-color); color: #334155; }
        .stat-value { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
        
        /* プログレスバーのアニメーション */
        .bar-bg { background-color: #e2e8f0; border-radius: 999px; overflow: hidden; height: 10px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.1); }
        .bar-fill { height: 100%; border-radius: 999px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* グラデーションテキスト */
        .text-gradient-blue { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, var(--team-main), var(--team-sub)); }
        .text-gradient-amber { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, #d97706, #fbbf24); }
        .text-gradient-rose { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, #be123c, #fb7185); }

        /* セレクトボックスの矢印カスタマイズ */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: "\f078"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.6); pointer-events: none; font-size: 12px;
        }

        /* 🖨️ 印刷用スタイル */
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background-color: #ffffff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            header { background: #0A2444 !important; padding: 12px 20px !important; }
            .btn-sync, .select-wrapper::after { display: none !important; }
            select#match-selector { appearance: none !important; -webkit-appearance: none !important; border: none !important; background: transparent !important; color: white !important; font-size: 1.25rem !important; padding: 0 !important; }
            .shadow-sm { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-gradient-to-r from-[#0A2444] to-[#004e7a] text-white shadow-md z-50 h-[4rem] sm:h-[5rem] flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-full flex justify-between items-center">
            
            <div class="flex items-center gap-4 sm:gap-6 w-full sm:w-auto">
                <!-- ロゴ・タイトル -->
                <h1 class="text-xl sm:text-2xl font-black tracking-widest leading-none drop-shadow-sm flex items-center flex-shrink-0">
                    <i class="fas fa-chart-line mr-2 text-[#0077B6]"></i> ITS U-15G
                </h1>
                
                <!-- PC/タブレット用 試合セレクター -->
                <div class="hidden sm:block select-wrapper bg-white/10 rounded-lg border border-white/20 px-3 py-1.5 focus-within:ring-2 focus-within:ring-[#0077B6] transition-all min-w-[280px] lg:min-w-[350px]">
                    <div class="text-[10px] text-[#0077B6] font-bold tracking-wider mb-0.5">分析する試合を選択</div>
                    <select id="match-selector" onchange="renderDashboard()" class="w-full bg-transparent text-white font-bold outline-none cursor-pointer text-sm sm:text-base appearance-none pr-6">
                        <option value="" class="text-slate-800">データを読み込み中...</option>
                    </select>
                </div>
            </div>

            <!-- 更新ボタン -->
            <button onclick="fetchData()" class="btn-sync px-3 sm:px-4 py-2 bg-white/10 hover:bg-white/20 text-xs sm:text-sm font-bold rounded-lg flex items-center transition-all border border-white/10 backdrop-blur-sm flex-shrink-0">
                <i class="fas fa-sync-alt mr-1.5" id="sync-icon"></i> <span class="hidden sm:inline">データ更新</span>
            </button>
        </div>
    </header>

    <!-- スマホ用 試合セレクター -->
    <div class="sm:hidden px-4 py-3 bg-white border-b border-slate-200 shadow-sm z-40 relative">
        <div class="text-[10px] text-slate-500 font-bold mb-1">分析する試合を選択</div>
        <select id="match-selector-mobile" onchange="syncSelectors(this)" class="w-full bg-slate-50 border border-slate-300 text-[#0A2444] text-sm font-bold rounded-lg p-2.5 outline-none">
            <option value="">データを読み込み中...</option>
        </select>
    </div>

    <!-- メインダッシュボード -->
    <!-- h-[calc...] の固定を外し、自然にスクロールするように変更 -->
    <main class="flex-grow w-full max-w-7xl mx-auto p-4 sm:p-5 relative flex flex-col">
        
        <!-- ローディングオーバーレイ -->
        <div id="loading-overlay" class="absolute inset-0 bg-[#f1f5f9]/90 backdrop-blur-sm z-40 flex flex-col items-center justify-center rounded-2xl">
            <i class="fas fa-circle-notch fa-spin text-5xl text-[#0077B6] mb-4"></i>
            <p class="font-bold text-slate-600 tracking-wider animate-pulse">データを読み込み中...</p>
        </div>

        <div id="dashboard-content" class="hidden flex flex-col gap-4 sm:gap-6 animate-[fadeIn_0.5s_ease-out]">
            
            <!-- 上段：サマリー＆レート -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
                
                <!-- チーム得点 -->
                <div class="col-span-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 flex flex-col justify-center items-center relative overflow-hidden group hover:border-[#0077B6] transition-all">
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-[#0077B6]"></div>
                    <i class="fas fa-futbol absolute -bottom-4 -left-4 text-7xl sm:text-8xl text-slate-50 transform -rotate-12 pointer-events-none group-hover:scale-110 transition-transform"></i>
                    <div class="text-xs sm:text-sm font-bold text-slate-400 mb-1 z-10">自分たちの得点</div>
                    <div class="text-5xl sm:text-6xl lg:text-7xl font-black text-gradient-blue stat-value z-10 leading-none my-1 sm:my-2" id="dash-goals">0</div>
                    <div class="text-sm sm:text-base font-black text-slate-700 z-10">チーム得点</div>
                </div>

                <!-- 相手得点 -->
                <div class="col-span-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 flex flex-col justify-center items-center relative overflow-hidden group hover:border-rose-400 transition-all">
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-rose-400"></div>
                    <i class="fas fa-times-circle absolute -bottom-4 -right-4 text-7xl sm:text-8xl text-rose-50 transform rotate-12 pointer-events-none group-hover:scale-110 transition-transform"></i>
                    <div class="text-xs sm:text-sm font-bold text-slate-400 mb-1 z-10">相手チームの得点</div>
                    <div class="text-5xl sm:text-6xl lg:text-7xl font-black text-gradient-rose stat-value z-10 leading-none my-1 sm:my-2" id="dash-allowed">0</div>
                    <div class="text-sm sm:text-base font-black text-slate-700 z-10">相手得点 (失点)</div>
                </div>

                <!-- シュート成功率 -->
                <div class="col-span-2 lg:col-span-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-[#0077B6]"><i class="fas fa-bullseye"></i></div>
                            <div class="text-sm sm:text-base font-black text-slate-700">チーム シュート成功率</div>
                        </div>
                        <div class="text-4xl sm:text-5xl lg:text-6xl font-black text-[#0077B6] stat-value mt-2 leading-none"><span id="dash-shot-rate">0.0</span><span class="text-xl sm:text-2xl text-slate-400 ml-1">%</span></div>
                    </div>
                    <div class="mt-4 sm:mt-6">
                        <div class="flex justify-between text-xs sm:text-sm font-bold text-slate-400 mb-1.5">
                            <span>ゴール数 / 試投数</span>
                            <span class="text-slate-600"><span id="dash-shot-detail">0 / 0</span></span>
                        </div>
                        <div class="bar-bg"><div class="bar-fill bg-gradient-to-r from-[#0A2444] to-[#0077B6]" id="bar-shot-rate" style="width: 0%;"></div></div>
                    </div>
                </div>

                <!-- GKセーブ率 -->
                <div class="col-span-2 lg:col-span-1 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-[#0A2444]"><i class="fas fa-hands"></i></div>
                            <div class="text-sm sm:text-base font-black text-slate-700">GK セーブ率</div>
                        </div>
                        <div class="text-4xl sm:text-5xl lg:text-6xl font-black text-[#0A2444] stat-value mt-2 leading-none"><span id="dash-save-rate">0.0</span><span class="text-xl sm:text-2xl text-slate-400 ml-1">%</span></div>
                    </div>
                    <div class="mt-4 sm:mt-6">
                        <div class="flex justify-between text-xs sm:text-sm font-bold text-slate-400 mb-1.5">
                            <span>セーブ数 / 被シュート数</span>
                            <span class="text-slate-600"><span id="dash-save-detail">0 / 0</span></span>
                        </div>
                        <div class="bar-bg"><div class="bar-fill bg-gradient-to-r from-slate-500 to-[#0A2444]" id="bar-save-rate" style="width: 0%;"></div></div>
                    </div>
                </div>
            </div>

            <!-- 下段：詳細アナリティクス -->
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 sm:gap-5">
                
                <!-- シュート種類別内訳 -->
                <div class="col-span-1 lg:col-span-3 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 flex flex-col relative overflow-hidden">
                    <h3 class="text-sm sm:text-base font-black text-slate-700 mb-4 flex items-center"><i class="fas fa-chart-bar text-[#0077B6] mr-2"></i>シュート種類別の決定率</h3>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 sm:gap-4 flex-grow" id="shot-types-container">
                        <!-- JSで生成 -->
                    </div>
                </div>

                <!-- チーム総ミス数 -->
                <div class="col-span-1 lg:col-span-1 bg-gradient-to-br from-amber-50 to-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-center items-center relative overflow-hidden group hover:border-[#F59E0B] transition-all">
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-[#F59E0B]"></div>
                    <i class="fas fa-exclamation-triangle absolute -bottom-6 -right-6 text-7xl sm:text-8xl text-amber-500/10 transform rotate-12 pointer-events-none group-hover:scale-110 transition-transform"></i>
                    <div class="text-xs sm:text-sm font-bold text-amber-600 mb-1 z-10">オーバーステップ・パスミス等</div>
                    <div class="text-6xl sm:text-7xl font-black text-gradient-amber stat-value z-10 leading-none my-2" id="dash-errors">0</div>
                    <div class="text-sm sm:text-base font-black text-slate-700 z-10">チーム総ミス数</div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // 🚨 GASのURL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzVq24DpMl9rmH2wj9a31WZKdHt5kLx0IPhcLszblpNqcZmgf3UEhWQjEqc9I5ikz9wmg/exec";
        let rawData = [];
        let matches = [];

        function formatDateString(rawDate) {
            if (!rawDate) return "日付不明";
            if (rawDate.includes('T')) {
                const d = new Date(rawDate);
                return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
            }
            return rawDate;
        }

        async function fetchData() {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.classList.add('fa-spin');
            document.getElementById('loading-overlay').classList.remove('hidden');
            document.getElementById('dashboard-content').classList.add('hidden');
            
            try {
                const response = await fetch(GAS_URL);
                rawData = await response.json();
                processMatches();
            } catch (error) {
                alert("データの取得に失敗しました。電波状況を確認してください。");
                console.error(error);
            } finally {
                if(icon) icon.classList.remove('fa-spin');
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        }

        function processMatches() {
            const matchGroups = {};
            rawData.forEach(row => {
                if(!row.opponent) return; 
                const cleanDate = formatDateString(row.matchDate);
                const key = `${cleanDate} vs ${row.opponent}`;
                if (!matchGroups[key]) matchGroups[key] = [];
                matchGroups[key].push(row);
            });

            matches = Object.keys(matchGroups).map(key => ({
                label: key,
                data: matchGroups[key]
            })).reverse(); 

            const optionsHTML = matches.length === 0 
                ? '<option value="">データがありません</option>'
                : matches.map((m, i) => `<option value="${i}">${m.label}</option>`).join('');

            document.getElementById('match-selector').innerHTML = optionsHTML;
            document.getElementById('match-selector-mobile').innerHTML = optionsHTML;

            if (matches.length > 0) {
                document.getElementById('dashboard-content').classList.remove('hidden');
                setTimeout(renderDashboard, 50);
            }
        }

        function syncSelectors(element) {
            const val = element.value;
            document.getElementById('match-selector').value = val;
            document.getElementById('match-selector-mobile').value = val;
            renderDashboard();
        }

        function renderDashboard() {
            const index = document.getElementById('match-selector').value;
            if (index === "") return;
            const matchData = matches[index].data;

            let stats = {
                goals: 0, miss: 0, errors: 0, saves: 0, allowed: 0,
                types: {
                    L: {g:0, m:0}, M: {g:0, m:0}, C: {g:0, m:0}, F: {g:0, m:0}, S: {g:0, m:0}
                }
            };

            matchData.forEach(p => {
                if (p.position === 'CP') {
                    ['L', 'M', 'C', 'F', 'S'].forEach(t => {
                        stats.types[t].g += p[`${t}_goals`];
                        stats.types[t].m += p[`${t}_miss`];
                        stats.goals += p[`${t}_goals`];
                        stats.miss += p[`${t}_miss`];
                    });
                    stats.errors += p.errors;
                } else if (p.position === 'GK') {
                    stats.saves += p.saves;
                    stats.allowed += p.allowed;
                }
            });

            document.getElementById('dash-goals').innerText = stats.goals;
            document.getElementById('dash-allowed').innerText = stats.allowed;
            document.getElementById('dash-errors').innerText = stats.errors;

            document.getElementById('bar-shot-rate').style.width = '0%';
            document.getElementById('bar-save-rate').style.width = '0%';

            setTimeout(() => {
                const totalShots = stats.goals + stats.miss;
                const shotRate = totalShots > 0 ? (stats.goals / totalShots) * 100 : 0;
                document.getElementById('dash-shot-rate').innerText = shotRate.toFixed(1);
                document.getElementById('dash-shot-detail').innerText = `${stats.goals} / ${totalShots}`;
                document.getElementById('bar-shot-rate').style.width = `${shotRate}%`;

                const totalFaced = stats.saves + stats.allowed;
                const saveRate = totalFaced > 0 ? (stats.saves / totalFaced) * 100 : 0;
                document.getElementById('dash-save-rate').innerText = saveRate.toFixed(1);
                document.getElementById('dash-save-detail').innerText = `${stats.saves} / ${totalFaced}`;
                document.getElementById('bar-save-rate').style.width = `${saveRate}%`;
            }, 50);

            const typeLabels = { L: 'ディスタンス', M: 'ミドル', C: 'カットイン', F: 'ノーマーク', S: 'サイド' };
            document.getElementById('shot-types-container').innerHTML = ['L', 'M', 'C', 'F', 'S'].map(t => {
                const g = stats.types[t].g;
                const total = g + stats.types[t].m;
                const rate = total > 0 ? (g / total) * 100 : 0;
                
                let colorClass = "text-slate-700";
                let topBarColor = "bg-slate-200";
                if(total > 0) {
                    if(rate >= 60) { colorClass = "text-[#0077B6]"; topBarColor = "bg-[#0077B6]"; }
                    else if(rate < 30) { colorClass = "text-rose-500"; topBarColor = "bg-rose-500"; }
                }

                return `
                    <div class="bg-slate-50 rounded-xl p-3 sm:p-4 flex flex-col justify-center items-center border border-slate-100 hover:border-slate-300 transition-colors h-full relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 ${topBarColor}"></div>
                        <div class="text-3xl sm:text-4xl font-black stat-value ${colorClass} mt-1 sm:mt-2 leading-none">${rate.toFixed(0)}<span class="text-xs sm:text-sm font-bold ml-0.5 text-slate-400">%</span></div>
                        <div class="font-black text-slate-700 mt-2 sm:mt-3 text-sm sm:text-base">${t} <span class="font-bold text-[10px] sm:text-xs text-slate-500 ml-1 block sm:inline text-center">${typeLabels[t]}</span></div>
                        <div class="mt-auto pt-2 sm:pt-3 w-full text-center border-t border-slate-200 border-dashed">
                            <span class="text-xs sm:text-sm font-bold text-slate-600">${g} <span class="text-slate-300 font-normal mx-0.5">/</span> ${total}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.onload = fetchData;
    </script>
</body>
</html>
